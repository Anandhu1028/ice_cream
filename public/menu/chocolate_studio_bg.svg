<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Studio Wall & Horizon Gradient matching Hero frame 190 bottom (#C6A892) -->
    <linearGradient id="studioWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C6A892" />
      <stop offset="18%" stop-color="#D0B49E" />
      <stop offset="42%" stop-color="#DEC6B2" />
      <stop offset="70%" stop-color="#EBDBCC" />
      <stop offset="100%" stop-color="#F5ECE1" />
    </linearGradient>

    <!-- Center Warm Studio Spotlight -->
    <radialGradient id="studioSpotlight" cx="50%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#FFF8F0" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#F2DFCF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C6A892" stop-opacity="0" />
    </radialGradient>

    <!-- Glossy Melted Chocolate Gradient -->
    <linearGradient id="darkChoc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0B05" />
      <stop offset="30%" stop-color="#2D150A" />
      <stop offset="65%" stop-color="#442111" />
      <stop offset="100%" stop-color="#200E06" />
    </linearGradient>

    <linearGradient id="chocHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A4822" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#D48A54" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#2D150A" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="chocSpecular" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#E8B084" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2D150A" stop-opacity="0" />
    </linearGradient>

    <!-- Silk Satin Drapery Wave Gradients -->
    <linearGradient id="silkWave1" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#DECBBC" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#F5EBE1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D4BFAD" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="silkWave2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6D5C7" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#FDFCFA" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#D9C5B4" stop-opacity="0.7" />
    </linearGradient>

    <!-- Soft Ambient Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2A1408" flood-opacity="0.28" />
    </filter>

    <filter id="particleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#1A0B05" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. Background Studio Environment -->
  <rect width="1920" height="1080" fill="url(#studioWall)" />
  <rect width="1920" height="1080" fill="url(#studioSpotlight)" />

  <!-- 2. Bottom Silk Satin Drapery Curves -->
  <g opacity="0.65">
    <path d="M-100,1080 C320,890 680,1040 1100,920 C1480,820 1780,960 2050,880 L2050,1080 Z" fill="url(#silkWave1)" />
    <path d="M-50,1080 C400,950 820,1060 1280,940 C1620,860 1850,980 2000,960 L2000,1080 Z" fill="url(#silkWave2)" />
  </g>

  <!-- 3. Top-Left Dynamic Melted Chocolate Splash Curve -->
  <g filter="url(#softShadow)">
    <!-- Main Left Chocolate Wave Swirl -->
    <path d="M-40,-40 C120,40 260,160 210,360 C170,520 70,640 -20,720 C-50,680 -30,480 30,380 C80,280 40,120 -60,20 Z" fill="url(#darkChoc)" />
    <!-- Glossy Ridge Highlight -->
    <path d="M-20,-10 C100,60 220,170 185,345 C150,480 75,580 0,660" fill="none" stroke="url(#chocHighlight)" stroke-width="12" stroke-linecap="round" opacity="0.85" />
    <!-- Fine Specular Glint -->
    <path d="M-10,10 C90,75 180,180 155,310 C130,420 85,490 20,560" fill="none" stroke="url(#chocSpecular)" stroke-width="4" stroke-linecap="round" opacity="0.9" />

    <!-- Secondary Fluid Tendril -->
    <path d="M120,-30 C190,80 240,210 330,240 C380,260 410,240 370,200 C300,130 220,40 160,-30 Z" fill="url(#darkChoc)" />
    <path d="M140,-10 C195,85 240,180 320,225" fill="none" stroke="url(#chocHighlight)" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- 4. Top-Right Dynamic Chocolate Splash Arc -->
  <g filter="url(#softShadow)">
    <!-- Main Right Splash Ribbon -->
    <path d="M1980,-20 C1820,60 1710,210 1760,390 C1800,520 1880,630 1960,700 C1980,650 1920,510 1870,410 C1830,310 1860,180 1990,40 Z" fill="url(#darkChoc)" />
    <path d="M1960,10 C1840,80 1750,210 1785,365 C1820,470 1875,560 1940,640" fill="none" stroke="url(#chocHighlight)" stroke-width="10" stroke-linecap="round" opacity="0.85" />
    <path d="M1945,30 C1855,95 1780,205 1805,335 C1830,420 1870,490 1920,560" fill="none" stroke="url(#chocSpecular)" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />

    <!-- Outward Splash Tendril -->
    <path d="M1840,-30 C1770,70 1710,180 1620,210 C1570,225 1550,205 1585,175 C1645,120 1720,45 1780,-30 Z" fill="url(#darkChoc)" />
    <path d="M1815,-10 C1760,75 1710,165 1630,195" fill="none" stroke="url(#chocHighlight)" stroke-width="5.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- 5. Floating Suspended Chocolate Particles & Droplets -->
  <g filter="url(#particleGlow)">
    <!-- Left Droplets -->
    <circle cx="280" cy="320" r="14" fill="url(#darkChoc)" />
    <circle cx="276" cy="316" r="4" fill="#FFFFFF" opacity="0.5" />

    <circle cx="240" cy="460" r="10" fill="url(#darkChoc)" />
    <circle cx="237" cy="457" r="3" fill="#FFFFFF" opacity="0.45" />

    <circle cx="340" cy="400" r="7" fill="url(#darkChoc)" />
    <circle cx="338" cy="398" r="2" fill="#FFFFFF" opacity="0.5" />

    <circle cx="170" cy="590" r="8.5" fill="url(#darkChoc)" />
    <circle cx="168" cy="588" r="2.5" fill="#FFFFFF" opacity="0.45" />

    <circle cx="95" cy="740" r="12" fill="url(#darkChoc)" />
    <circle cx="92" cy="736" r="3.5" fill="#FFFFFF" opacity="0.5" />

    <!-- Floating 3D Chocolate Chunks (Left) -->
    <polygon points="360,150 382,135 398,155 376,170" fill="#200E06" />
    <polygon points="360,150 376,170 372,185 356,165" fill="#3D1A0A" />
    <polygon points="382,135 398,155 394,170 378,150" fill="#5A2810" />

    <polygon points="210,540 224,528 238,542 224,554" fill="#2A1208" />
    <polygon points="210,540 224,554 220,564 206,550" fill="#441E0D" />

    <!-- Right Droplets -->
    <circle cx="1680" cy="290" r="13" fill="url(#darkChoc)" />
    <circle cx="1676" cy="286" r="4" fill="#FFFFFF" opacity="0.55" />

    <circle cx="1610" cy="380" r="9" fill="url(#darkChoc)" />
    <circle cx="1607" cy="377" r="2.5" fill="#FFFFFF" opacity="0.5" />

    <circle cx="1720" cy="480" r="11" fill="url(#darkChoc)" />
    <circle cx="1717" cy="476" r="3" fill="#FFFFFF" opacity="0.5" />

    <circle cx="1810" cy="610" r="8" fill="url(#darkChoc)" />
    <circle cx="1808" cy="608" r="2" fill="#FFFFFF" opacity="0.4" />

    <!-- Floating 3D Chocolate Chunks (Right) -->
    <polygon points="1540,140 1565,125 1582,148 1557,163" fill="#200E06" />
    <polygon points="1540,140 1557,163 1553,178 1536,155" fill="#3D1A0A" />
    <polygon points="1565,125 1582,148 1578,163 1561,140" fill="#5A2810" />

    <polygon points="1660,560 1675,548 1690,562 1675,574" fill="#2A1208" />
    <polygon points="1660,560 1675,574 1671,585 1656,571" fill="#441E0D" />

    <!-- Tiny Cocoa Dust Flecks -->
    <circle cx="420" cy="280" r="3" fill="#3D1A0A" opacity="0.6" />
    <circle cx="460" cy="350" r="2.5" fill="#3D1A0A" opacity="0.5" />
    <circle cx="390" cy="480" r="3.5" fill="#3D1A0A" opacity="0.6" />
    <circle cx="1510" cy="260" r="3" fill="#3D1A0A" opacity="0.6" />
    <circle cx="1470" cy="330" r="2.5" fill="#3D1A0A" opacity="0.5" />
    <circle cx="1580" cy="490" r="3.5" fill="#3D1A0A" opacity="0.6" />
  </g>

  <!-- 6. Seamless Top Transition Blend (Guarantees 100% Invisible Connection to Hero) -->
  <rect x="0" y="0" width="1920" height="80" fill="url(#topSeamBlend)" />
  <linearGradient id="topSeamBlend" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#C6A892" stop-opacity="1" />
    <stop offset="35%" stop-color="#C6A892" stop-opacity="0.8" />
    <stop offset="100%" stop-color="#C6A892" stop-opacity="0" />
  </linearGradient>
</svg>
